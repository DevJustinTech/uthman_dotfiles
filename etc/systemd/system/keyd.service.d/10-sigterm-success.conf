# keyd 2.6.0 installs signal(SIGTERM, exit). The handler receives the signal
# number (15) and calls exit(15), so every clean shutdown is recorded by
# systemd as `code=exited, status=15` and keyd.service ends up failed.
#
# Whitelist only that exit code; a real crash still surfaces. Upstream source:
# https://github.com/rvaiya/keyd/blob/master/src/keyd.c (signal handlers).
[Service]
SuccessExitStatus=15
