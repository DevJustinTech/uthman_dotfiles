# bt-agent is a USER unit. `PartOf=bluetooth.service` does not reach the
# system manager's bluetooth.service (there is no user unit by that name —
# `systemctl --user show bluetooth.service` returns LoadState=not-found), so
# the previous drop-in never actually tied the two together.
#
# On shutdown bluetoothd disappears before the user manager stops bt-agent.
# bt-agent's unregister call then fails with
# `org.freedesktop.DBus.Error.NoReply: Remote peer disconnected` and it exits
# 1, which systemd records as a failed unit. That exit is the expected
# outcome of the peer going away, so whitelist code 1; genuine crashes still
# surface.
[Service]
SuccessExitStatus=1
