# ── Intentionally absent ────────────────────────────────────────────────
# These four were dropped rather than left to fail:
#
#   sddm      -> /usr/share/sddm/themes/elarun-custom/Palette.qml
#   obsidian  -> <notes vault>/.obsidian/snippets/matugen.css
#   cavasik   -> ~/.config/cavasik/colors.rgb
#   hyprlock-omarchy -> ~/.config/omarchy/current/theme/hyprlock.conf
#
# matugen aborts the whole run on an output it cannot write, so leaving a
# root-owned or nonexistent-path output in the default set makes EVERY
# wallpaper change report failure and skip the cursor/reload steps in
# getTheme. That is a worse failure than the feature being off.
#
# sddm: /usr/share is root-owned and the SDDM greeter runs as its own user, so
#   a wallpaper-driven login palette would need a root prompt on every theme
#   change. Omarchy's login theme stays instead. To use elarun-custom anyway,
#   install it and repoint SDDM by hand -- see README "Login screen".
# obsidian: pointed at a personal notes vault path that does not exist here.
# cavasik: Cavasik is not installed; this desktop uses plain cava.
# hyprlock-omarchy: only read by the Omarchy shell we replaced. The live
#   hyprlock palette (hyprlock-standalone) is still generated.
