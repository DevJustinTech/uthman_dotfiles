[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
# Run zsh, not bash. Without this foot inherits $SHELL (bash here) and the
# whole dotfiles config is bypassed: .zshrc holds 42 alias/export/setopt lines
# including the eza aliases, and it is what calls ~/.local/bin/shell-splash --
# the startup splash with the random quote from
# .config/hypr/scripts/quotes.txt (161 quotes, C.S. Lewis included).
# kitty got this via `shell /usr/bin/zsh` in kitty.conf; foot needs it here.
shell=/usr/bin/zsh
font=JetBrainsMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
