# FailWatch caught omarchy-sleep-lock.service failing with exit-code mid-suspend
# (2026-10-16 08:21): the sleep monitor exits by design when a suspend starts --
# it has just asked omarchy-shell (-> the fork's hyprlock shim) to secure the
# session and lets logind proceed by releasing its delay inhibitor.
# Restart=always brings it straight back, but a restart landing while the sleep
# is still in flight gets its fresh sleep inhibitor refused by logind ("The
# operation inhibition has been requested for is already running"), the unit is
# marked failed, and the pending retry freezes with the machine -- the failure
# only surfaces after resume (FailWatch logs it then, timestamped on wake).
#
# logind waits at most InhibitDelayMaxSec (15s on this machine) before it
# suspends regardless, so restarting 20s after exit always lands past the
# freeze: the countdown is then frozen with the machine and completes on
# resume. Never a spurious failed unit, and the monitor is back ~20s after
# wake -- far inside any realistic next suspend.
[Service]
RestartSec=20s
