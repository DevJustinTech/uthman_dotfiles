[config]
contrast = 0.2
variation = "standard"

# No reload_apps block. This used to send a Waybar signal on write; nothing on
# this desktop runs Waybar, and it was never used anyway -- the Quickshell
# shell polls ~/.config/quickshell/colors.css on a 1s timer instead, because
# matugen replaces the file (new inode) rather than editing it.

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/quickshell/colors.css"

# ── Hyprland ────────────────────────────────────────────────────────────
# One Lua module, consumed by ~/.config/hypr/theme.lua via require("theme.colors").
# It lives at ~/.config/theme/colors.lua rather than theme/current/ because
# package.path resolves "theme.colors" to exactly that path.
#
# This replaces the three hyprland-colors.conf outputs that used to be
# `source`d from hyprland.conf. Source directives are gone under Hyprland's
# Lua config, so a .conf palette has nowhere to hook in any more.
[templates.hyprland-colors]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/theme/colors.lua"

[templates.hyprland-theme]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/theme/themes/snow_black/colors.lua"

# hyprlock is still a .conf application, so it keeps a .conf palette and is
# pulled in by ~/.config/hypr/hyprlock.conf.

[templates.hyprlock-standalone]
input_path = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/theme/current/hyprlock.conf"

[templates.kitty-theme]
input_path = "~/.config/matugen/templates/kitty-theme.conf"
output_path = "~/.config/theme/themes/snow_black/kitty.conf"

[templates.kitty-current]
input_path = "~/.config/matugen/templates/kitty-theme.conf"
output_path = "~/.config/omarchy/current/theme/kitty.conf"

[templates.kitty-standalone]
input_path = "~/.config/matugen/templates/kitty-theme.conf"
output_path = "~/.config/theme/current/kitty.conf"

# foot is the live terminal (the xdg-terminal-exec shim routes there). Same
# two-dir pattern as kitty: theme/current is what ~/.config/foot/foot.ini
# includes.
[templates.foot-theme]
input_path = "~/.config/matugen/templates/foot-theme.ini"
output_path = "~/.config/theme/themes/snow_black/foot.ini"

[templates.foot-current]
input_path = "~/.config/matugen/templates/foot-theme.ini"
output_path = "~/.config/theme/current/foot.ini"


