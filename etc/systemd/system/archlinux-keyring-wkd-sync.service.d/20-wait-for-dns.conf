# The timer can fire immediately after resume from suspend, while
# NetworkManager is still disconnected. On 2026-11-05 it fired 0.2s after
# resume; every WKD lookup failed with "resolving 'archlinux.org' failed:
# Server indicated a failure", the service exited 101, and it only recovered
# on the 5-minute on-failure retry.
#
# Wait up to 60s for name resolution before doing the refresh. If DNS is
# genuinely unavailable after that, the existing on-failure retry still
# applies.
[Service]
ExecStartPre=/usr/bin/bash -c 'for i in {1..12}; do /usr/bin/getent ahosts archlinux.org >/dev/null 2>&1 && exit 0; sleep 5; done; exit 1'
