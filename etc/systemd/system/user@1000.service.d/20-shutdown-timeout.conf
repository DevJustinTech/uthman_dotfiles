# The global fast-shutdown setting (/etc/systemd/system.conf.d/
# 10-faster-shutdown.conf) gives user managers only 5s to stop. On
# 2026-11-05 the manager was still waiting for hermes-gateway.service to
# drain (its own TimeoutStopSec is 70s), so PID 1 SIGKILLed the whole user
# manager and recorded user@1000.service as `Failed with result 'timeout'`.
#
# Give the manager enough room to let Hermes finish normally without
# abandoning the fast-shutdown default for every other unit.
[Service]
TimeoutStopSec=15s
