general {
    lock_cmd = pidof hyprlock || hyprlock
    # before_sleep_cmd used to be `loginctl lock-session`, which is a no-op
    # here: that only works if something is already registered as the session
    # lock client, and nothing is when the session goes idle. Lock hyprlock
    # directly instead, matching lock_cmd and the SUPER + L binding.
    before_sleep_cmd = pidof hyprlock || hyprlock
    # 0.56: dispatchers are Lua -- `hyprctl dispatch dpms on` dies with a parse
    # error ('")" expected near 'on''), so the expression must be wrapped.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
    inhibit_sleep = 3
}

listener {
    timeout = 120
    on-timeout = launch-screensaver
}

listener {
    # 5 minutes idle -> lock. Also `loginctl lock-session` for the same reason
    # as before_sleep_cmd: it is only a request to whichever client holds the
    # session lock, and there is none. Launch hyprlock outright.
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}
